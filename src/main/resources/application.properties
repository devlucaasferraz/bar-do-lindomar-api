spring.application.name=bar-do-lindomar-api
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.docker.compose.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.issuer=bar-do-lindomar-api
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:28800}
app.admin.nome=${ADMIN_NOME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
spring.flyway.url=${DB_MIGRATIONS_URL:${spring.datasource.url}}
spring.flyway.user=${DB_MIGRATIONS_USER:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATIONS_PASSWORD:${spring.datasource.password}}
