spring.application.name=bar-do-lindomar-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lindomar}
spring.datasource.username=${DB_USER:lindomar}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.docker.compose.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=bar-do-lindomar-api
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:28800}
app.admin.nome=${ADMIN_NOME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}
