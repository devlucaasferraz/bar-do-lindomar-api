services:
  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_MIGRATIONS_URL: ${DB_MIGRATIONS_URL:-}
      DB_MIGRATIONS_USER: ${DB_MIGRATIONS_USER:-}
      DB_MIGRATIONS_PASSWORD: ${DB_MIGRATIONS_PASSWORD:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 bytes}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
    ports:
      - "${API_PORT:-8080}:8080"
